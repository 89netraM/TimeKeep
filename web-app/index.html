<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>TimeKeep</title>
  </head>
  <body>
    <nav>
      <h1>TimeKeep</h1>
      <button command="show-modal" commandfor="settingsDialog">⚙️</button>
    </nav>
    <button id="addButton">➕</button>
    <ul id="newButtons" popover>
      <li><button command="show-modal" commandfor="newCategoryDialog">New Category 📁</button></li>
      <li><button command="show-modal" commandfor="newProjectDialog">New Project 🗃️</button></li>
    </ul>
    <main>
      <section>
        <div>
          <h2 id="timeWorked">0h 00m</h2>
          <p>Time Worked</p>
        </div>
        <div>
          <h2 id="goHomeTime">16:00</h2>
          <p>Go Home Time</p>
        </div>
      </section>
      <section id="active">
        <h2>Active</h2>
      </section>
      <section id="today">
        <h2>Today</h2>
      </section>
    </main>
    <dialog id="settingsDialog" closedby="any">
      <form method="dialog">
        <h1>Settings</h1>
        <label>
          <span>Token:</span>
          <input id="token" type="password" placeholder="Token">
        </label>
        <button type="submit" value="save">Save</button>
      </form>
    </dialog>
    <dialog id="entryDialog" closedby="any">
      <form method="dialog">
        <h1><span id="entryFormReason">New</span> Entry</h1>
        <label>
          <span>Start:</span>
          <input id="start" type="datetime-local" required>
        </label>
        <label for="end">
          <span>End:</span>
          <input id="end" type="datetime-local">
        </label>
        <label>
          <span>Project:</span>
          <select id="project"></select>
        </label>
        <label>
          <span>Categories:</span>
          <span id="categories"></span>
          <span>
            <input id="categoryInput" list="allCategories">
            <button id="addCategoryButton">+</button>
          </span>
        </label>
        <label>
          <span>Location:</span>
          <select id="location"></select>
        </label>
        <button type="submit" value="save">Save</button>
      </form>
    </dialog>
    <dialog id="newCategoryDialog" closedby="any">
      <form method="dialog">
        <h1>New Category</h1>
        <label>
          <span>Category:</span>
          <input id="category" type="text" required>
        </label>
        <button type="submit" value="save">Save</button>
      </form>
    </dialog>
    <dialog id="newProjectDialog" closedby="any">
      <form method="dialog">
        <h1>New Project</h1>
        <label>
          <span>Project:</span>
          <input id="newProject" type="text" required>
        </label>
        <label>
          <span>Categories:</span>
          <span id="newProjectCategories"></span>
          <span>
            <input id="newProjectCategoryInput" list="allCategories">
            <button id="newProjectAddCategoryButton">+</button>
          </span>
        </label>
        <button type="submit" value="save">Save</button>
      </form>
    </dialog>
    <dialog id="deleteDialog" closedby="any">
      <form method="dialog">
        <h1>Delete</h1>
        <p>Are you sure?</p>
        <button type="submit" value="delete">Delete</button>
        <button type="submit" value="cancel">Cancel</button>
      </form>
    </dialog>
    <dialog id="endDialog" closedby="any">
      <form method="dialog">
        <h1>End</h1>
        <label for="end">
          <span>End:</span>
          <input id="endEnd" type="datetime-local">
        </label>
        <button type="submit" value="end">End</button>
        <button type="submit" value="cancel">Cancel</button>
      </form>
    </dialog>
    <datalist id="allCategories"></datalist>
    <template id="entryTemplate">
      <style>
        #container {
          overflow: auto hidden;
          -webkit-overflow-scrolling: touch;
          overscroll-behavior: none;
          scroll-snap-type: inline mandatory;
          position: relative;
          display: grid;
          grid-template:
            "info buttons" auto
            / 100% auto;
          border-block-end: 1px var(--accent-border) solid;

          scrollbar-width: none;

          &::-webkit-scrollbar {
            background: none;
            width: 0;
          }

          #top {
            scroll-snap-align: end;
            background-color: var(--bg);
            display: grid;
            grid-template:
              "from       dash       to" auto
              "location   location   location" auto
              "categories categories categories" auto
              / 1fr auto 1fr;
            column-gap: 0.25rem;
            padding-block: 0.5rem;
            grid-area: info;
            position: relative;
            z-index: 2;

            #from {
              text-align: end;
            }

            #from, #to {
              font-variant-numeric: tabular-nums;
            }

            #location {
              text-align: center;
              grid-area: location;
            }

            #categories {
              display: flex;
              flex-wrap: wrap;
              gap: 0.25rem;
              justify-content: center;
              grid-area: categories;

              &:has(*) {
                margin-block: 0.25rem;
              }

              span {
                background-color: var(--accent);
                color: var(--text-h);
                border-radius: 0.5rem;
                padding: 0.125rem 0.25rem;
              }
            }
          }

          #behind {
            scroll-snap-align: start;
            grid-area: buttons;
            display: flex;
            align-items: center;
            justify-content: end;
            position: sticky;
            right: 0px;
            z-index: 1;

            button {
              border: none;
              background: none;
              font-size: 1.25rem;
              position: relative;
              z-index: 1;
            }
          }
        }
      </style>

      <div id="container">
        <div id="top">
          <span id="from">08:00</span>
          <span>-</span>
          <span id="to"></span>
          <span id="location">home (Norra Gubberogatan 3, lgh 44, 41663 Göteborg)</span>
          <div id="categories">
            <span>work</span>
            <span>volvo</span>
          </div>
        </div>
        <div id="behind">
          <button id="deleteButton">🗑️</button>
          <button id="editButton">✏️</button>
          <button id="endButton">🛑</button>
        </div>
      </div>
    </template>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
