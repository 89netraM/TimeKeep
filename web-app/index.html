<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>TimeKeep</title>
  </head>
  <body>
    <nav>
      <h1>TimeKeep</h1>
      <button command="show-modal" commandfor="settingsDialog">⚙️</button>
    </nav>
    <button id="addButton">➕</button>
    <ul id="newButtons" popover>
      <li><button command="show-modal" commandfor="newCategoryDialog">New Category 📁</button></li>
      <li><button command="show-modal" commandfor="newProjectDialog">New Project 🗃️</button></li>
    </ul>
    <dialog id="settingsDialog" closedby="any">
      <form method="dialog">
        <h1>Settings</h1>
        <label>
          <span>Token:</span>
          <input id="token" type="password" placeholder="Token">
        </label>
        <button type="submit" value="save">Save</button>
      </form>
    </dialog>
    <dialog id="entryDialog" closedby="any">
      <form method="dialog">
        <h1><span id="entryFormReason">New</span> Entry</h1>
        <label>
          <span>Start:</span>
          <input id="start" type="datetime-local" required>
        </label>
        <label for="end">
          <span>End:</span>
          <input id="end" type="datetime-local">
        </label>
        <label>
          <span>Project:</span>
          <select id="project"></select>
        </label>
        <label>
          <span>Categories:</span>
          <span id="categories"></span>
          <span>
            <input id="categoryInput" list="allCategories">
            <button id="addCategoryButton">+</button>
          </span>
        </label>
        <label>
          <span>Location:</span>
          <select id="location"></select>
        </label>
        <button type="submit" value="save">Save</button>
      </form>
    </dialog>
    <dialog id="newCategoryDialog" closedby="any">
      <form method="dialog">
        <h1>New Category</h1>
        <label>
          <span>Category:</span>
          <input id="category" type="text" required>
        </label>
        <button type="submit" value="save">Save</button>
      </form>
    </dialog>
    <dialog id="newProjectDialog" closedby="any">
      <form method="dialog">
        <h1>New Project</h1>
        <label>
          <span>Project:</span>
          <input id="newProject" type="text" required>
        </label>
        <label>
          <span>Categories:</span>
          <span id="newProjectCategories"></span>
          <span>
            <input id="newProjectCategoryInput" list="allCategories">
            <button id="newProjectAddCategoryButton">+</button>
          </span>
        </label>
        <button type="submit" value="save">Save</button>
      </form>
    </dialog>
    <datalist id="allCategories"></datalist>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
